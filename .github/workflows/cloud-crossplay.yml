name: Cloud cross-platform match
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native game client
        type: choice
        options: [macos-15, windows-2022]
        default: macos-15
permissions:
  contents: read
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Play against the temporary Mumbai machines
        env:
          CONFIG_URL: ${{ inputs.runner == 'windows-2022' && secrets.QONSOLE_WINDOWS_TEST_CONFIG || secrets.QONSOLE_MAC_TEST_CONFIG }}
        shell: bash
        run: |
          set -eu
          umask 077
          test -n "$CONFIG_URL"
          tmp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -u "$tmp"); fi
          work=$(mktemp -d "$tmp/qonsole.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"
          curl -fsSL --retry 3 "$CONFIG_URL" -o config.json
          for key in shared bundle; do
            url=$(node -p "require('./config.json')['$key']")
            curl -fsSL --retry 3 "$url" -o "$key.zip"
            unzip -oq "$key.zip"
          done
          chmod +x bin/*
          repo="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = Windows ]; then repo=$(cygpath -u "$repo"); fi
          cp "$repo/scripts/cloud-crossplay.mjs" scripts/cloud-crossplay.mjs
          node scripts/cloud-crossplay.mjs
