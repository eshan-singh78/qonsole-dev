<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.peerjs.com wss://*.peerjs.com; object-src 'none'; base-uri 'none'"
    />
    <title>Qonsole</title>
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <header>
      <span class="word"><i></i>Qonsole</span
      ><button class="quiet" id="files">Game files</button>
    </header>
    <main>
      <section id="home">
        <h1>Game library</h1>
        <div class="cards">
          <article class="card fighter">
            <span>PlayStation · Fighting</span>
            <h2>TEKKEN <b>3</b></h2>
            <button id="solo-tekken">Play solo</button>
          </article>
          <article class="card rider">
            <span>Windows 95 · Racing</span>
            <h2>ROAD RASH</h2>
            <button id="solo-road">Play solo</button>
          </article>
        </div>
        <section class="panel">
          <h2>Play together</h2>
          <div class="fields">
            <label
              >Your name<input
                id="name"
                maxlength="24"
                value="Player"
                autocomplete="off"
            /></label>
            <label
              >Connection<select id="transport">
                <option value="internet">Internet</option>
                <option value="lan">Local network</option>
              </select></label
            >
          </div>
          <div class="actions">
            <button id="host" class="primary">Host room</button>
            <form id="join">
              <label class="sr" for="invite">Room code or invite</label
              ><input
                id="invite"
                placeholder="Room code or invite"
                maxlength="5000"
                required
                autocomplete="off"
              /><button>Join room</button>
            </form>
          </div>
        </section>
      </section>
      <section id="lobby" hidden>
        <div class="top">
          <div>
            <p class="eyebrow" id="scope"></p>
            <h1>Room <span id="code"></span></h1>
          </div>
          <button id="leave" class="quiet">Leave room</button>
        </div>
        <div class="actions" id="invite-actions">
          <button id="copy-code">Copy code</button
          ><button id="copy-invite" hidden>Copy connection invite</button>
        </div>
        <p class="hint" id="connection"></p>
        <div class="columns">
          <section class="panel">
            <h2>Matches</h2>
            <div id="matches"></div>
            <div class="actions">
              <button id="start-tekken">Start Tekken 3</button
              ><button id="start-road">Start Road Rash</button>
            </div>
          </section>
          <section class="panel">
            <h2>Players</h2>
            <ul id="members"></ul>
          </section>
        </div>
      </section>
      <section id="solo" class="panel" hidden>
        <p class="eyebrow">Native game</p>
        <h1 id="solo-title"></h1>
        <button id="stop-solo">Close game</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <dialog id="settings">
        <h2>Game files</h2>
        <p>
          Your game files stay on this computer. OpenKumite can also import a
          disc from its own Game data screen.
        </p>
        <div id="paths"></div>
        <button id="done">Done</button>
      </dialog>
    </main>
    <script src="../node_modules/peerjs/dist/peerjs.min.js"></script>
    <script type="module" src="ui.mjs"></script>
  </body>
</html>
