<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101213" />
    <link rel="stylesheet" href="/style.css" />
    <title>Qonsole player</title>
  </head>
  <body class="player">
    <header class="mast">
      <a class="wordmark" href="/"
        ><span class="mark" aria-hidden="true"></span>Qonsole</a
      ><a href="/" class="navlink">← Game library</a>
    </header>
    <main class="session">
      <p class="platform" id="edition"></p>
      <h1 id="game"></h1>
      <p id="intro"></p>
      <section id="lobby" aria-label="Play options">
        <div class="play-options">
          <button id="launch">Open game</button
          ><button id="host" class="secondary">Host a match</button>
          <form id="join">
            <label for="code">Room code</label
            ><input
              id="code"
              required
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
            /><button class="secondary">Join</button>
          </form>
        </div>
        <p id="explain"></p>
      </section>
      <p role="status" id="status"></p>
      <div id="invitation" hidden>
        <strong id="room"></strong
        ><button id="copy" class="secondary">Copy invite link</button>
      </div>
      <section id="stage" hidden aria-label="Game">
        <div class="stagebar">
          <span id="mode"></span>
          <div>
            <button id="expand" class="textbutton" hidden>Fullscreen</button>
            <button id="leave" class="textbutton">Close game</button>
          </div>
        </div>
        <iframe
          id="engine"
          title="Game engine"
          allow="fullscreen; gamepad; autoplay; screen-wake-lock"
          allowfullscreen
        ></iframe>
      </section>
      <p class="credit">
        Unofficial rework ·
        <a id="source" target="_blank" rel="noreferrer">Project and credits</a>
      </p>
    </main>
    <script src="/player.js" type="module"></script>
  </body>
</html>
